name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r mcp_servers/marketplace/requirements.txt httpx==0.28.1
      - name: Run offline suites
        run: python tests/run.py
