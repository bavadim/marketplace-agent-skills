<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Подключение маркетплейсов</title><link rel="stylesheet" href="/viewer.css"></head>
<body><main><h1>Подключение аккаунтов</h1><p>Выбери площадку, войди на её странице и нажми «Проверить вход». Данные входа сохранятся на этом компьютере.</p>
<nav id="providers"></nav><div class="toolbar"><button id="verify">Проверить вход</button><button id="finish">Завершить подключение</button><button id="cancel">Закрыть</button></div>
<p id="status" role="status">Загрузка…</p><p class="hint">Кликни по странице ниже, чтобы вводить текст. Работают клавиатура, вставка текста и прокрутка.</p>
<div id="viewport" tabindex="0" aria-label="Страница выбранной площадки"><img id="frame" alt="Страница входа маркетплейса" draggable="false"></div>
<p id="expiry"></p></main><script src="/viewer.js"></script></body></html>
