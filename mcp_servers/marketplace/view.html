<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Удалённый браузер · Ozon</title>
<style>body{margin:0;background:#172033;color:white;font:16px system-ui}header{padding:8px;display:flex;flex-wrap:wrap;gap:8px}input,button{font:inherit}#screen{height:80dvh;touch-action:none}</style>
<header><span id="status" role="status">Запускаем браузер на сервере…</span>
<button id="done" disabled>Завершить ручной вход</button>
<input id="keys" type="password" autocomplete="off" autocapitalize="off" placeholder="Клавиатура телефона" aria-label="Ввод в выбранное поле удалённого браузера" disabled></header>
<div id="screen"></div><script type="module" src="/view-client.js"></script></html>
